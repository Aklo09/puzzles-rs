name: CI

# Kept deliberately frugal (macOS runners in particular are scarce):
# - pull requests run Ubuntu and Windows;
# - macOS runs only on demand: start the workflow by hand from the Actions
#   tab, or `gh workflow run ci.yml --ref <branch>` (macOS on by default);
# - pull requests that only touch documentation don't run at all;
# - tests don't rerun after merging to main (the PR run already tested the
#   same code, squash merges), but main builds without testing to fill
#   the dependency cache: a pull request can only restore caches from its
#   own branch or from main, so without it every PR compiles all its
#   dependencies from scratch. Only main saves caches; PRs restore them.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENCE"
      - ".claude/**"
      - ".agents/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENCE"
      - ".claude/**"
      - ".agents/**"
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough for panic backtraces in CI; full debug info makes
  # the cache several times larger and linking slower (most on Windows).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      # Run every OS to the end: a failure on one shouldn't hide the others,
      # since OS-specific differences are exactly what this matrix is for.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The C reference sources (third_party/puzzles-c) for the oracle tests.
          submodules: true

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A software Vulkan driver (Mesa's lavapipe), so the desktop app's
      # wgpu UI tests render on runners without a GPU.
      - if: runner.os == 'Linux' && github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      # Same checks as locally: fmt, clippy (-D warnings), all tests
      # including the C oracle (MSVC on Windows, gcc on Linux, clang on macOS).
      - if: github.event_name != 'push'
        run: cargo xtask ci

      # On main: build what the checks build, for the cache.
      - if: github.event_name == 'push'
        run: cargo xtask ci --build-only

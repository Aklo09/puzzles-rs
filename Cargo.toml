[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal and external crates are added here when a crate first uses them
# (dependency policy, docs/porting-plan.md §5); Cargo warns on unused entries.
puzzles-canvas = { path = "crates/puzzles-canvas" }
puzzles-cli = { path = "crates/puzzles-cli" }
puzzles-core = { path = "crates/puzzles-core" }
puzzles-games = { path = "crates/puzzles-games", default-features = false }
puzzles-theme = { path = "crates/puzzles-theme" }
ab_glyph = "0.2"
anyhow = "1.0"
bitflags = "2.13"
cc = "1.11"
clap = { version = "4.6", features = ["derive"] }
csscolorparser = "0.9"
directories = "6.0"
eframe = "0.36"
egui-phosphor = "0.14"
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
hex = "0.4"
insta = "1.49"
itertools = "0.15"
notify = "9.0"
palette = { version = "0.7", default-features = false, features = ["std"] }
pollster = "0.4"
proptest = "1.12"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
sha1_smol = "1.0"
sorted-vec = "0.8"
thiserror = "2.0"
tiny-skia = "0.12"
toml = "1.2"

[workspace.lints.rust]
# `deny` rather than `forbid` so that exactly one place can opt out: the FFI
# module of the test-only `c-oracle` crate. No other crate may allow it.
unsafe_code = "deny"
missing_docs = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Ported C code is integer-cast heavy (i32 coordinates, usize indexing).
# Casts are reviewed during porting; these lints would flag nearly every line.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# C variable naming (x/y/dx/dy, w/h, ...) is kept for traceability to upstream.
similar_names = "allow"
many_single_char_names = "allow"
# Generators and solvers are long by nature; we split by meaning, not by length.
too_many_lines = "allow"

[profile.release]
# The C project keeps assertions on in release builds on purpose; we also
# keep integer-overflow checks, since silent wraparound would hide port bugs.
overflow-checks = true

[profile.dev.package."*"]
# Optimise dependencies in debug builds so the GUI stays responsive and
# puzzle generation in tests isn't slow; our own crates stay fast to compile.
opt-level = 2

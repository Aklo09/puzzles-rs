[package]
name = "puzzles-games"
description = "The puzzles of the collection, one module per game, plus the game registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One feature per game (D3), all puzzles on by default. `nullgame` is
# C's template game: off by default and never in the registry.
[features]
default = ["flip"]
flip = []
nullgame = []

[dependencies]
puzzles-core.workspace = true

[dev-dependencies]
proptest.workspace = true
puzzles-theme.workspace = true

[lints]
workspace = true
